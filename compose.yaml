# Postgres with pgvector for the article vectors (D-041). Start it with `docker compose up -d`.
# The password comes from POSTGRES_PASSWORD in .env, and the port is open to this machine only.
services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: srag
      POSTGRES_DB: srag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates srag_test, the database the opt-in tests use, on the first start.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srag -d srag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
